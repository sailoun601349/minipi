# minipi · electron-builder 配置
#
# 目标：产出一个客户双击就能装的安装包（Windows nsis / macOS dmg）。
#
# ⚠ 三条打包相关的硬约束（都踩过，别改）
#   1. `files` 必须把 `scripts/probe/stub.html` 打进去 —— `window.js:51` 的
#      `FALLBACK_ENTRY` 指向它。渲染层缺失时它是唯一的兜底页，丢了就是白屏。
#   2. `asarUnpack` 给 pi-coding-agent 的 worker 入口留口子 —— 它在运行时
#      `child_process.spawn` 自己，asar 内的路径 spawn 不了。
#   3. 不要加 `--disable-gpu`（透明窗依赖 DWM）；`index.js:55` 已经
#      appendSwitch("disable-gpu-sandbox")，打包后自动生效，这里不用管。

appId: com.minipi.desktop
productName: minipi
copyright: Copyright © 2026 minipi

directories:
  output: dist
  buildResources: build

# 只打运行时真正需要的：源码 + 兜底页 + 图标资源。
# 不打：docs（开发文档）、scripts 里的验证脚本、.agent-runs、node_modules/.cache
files:
  - src/**/*
  - scripts/probe/stub.html
  - package.json
  # 依赖由 electron-builder 依据 package.json 的 dependencies 自动收集；
  # devDependencies 一律不进包（electron-builder 默认行为）。
  - "!**/*.map"
  - "!**/*.md"
  - "!**/{test,tests,__tests__,spec,example,examples,docs}/**"
  - "!**/.github/**"
  - "!**/.agent-runs/**"

# pi-coding-agent 运行时会 spawn 自身（worker / 子命令），asar 内无法 spawn
asarUnpack:
  - node_modules/@earendil-works/pi-coding-agent/**

# ⚠ 离线打包：直接复用 node_modules/electron/dist（本地已有完整 44.4.3 解包）
# 不加这行，electron-builder 会去 GitHub 下载 Electron 压缩包 ——
# 本机实测会遇到 502 Bad Gateway / 公司网络拦截，导致打包完全卡死。
# 代价：electronDist 必须与 devDependencies.electron 版本严格一致，
# 否则打出来的包里 Electron 版本与 package.json 声称的不符（客户看到版本错乱）。
electronDist: node_modules/electron/dist

asar: true
# 压缩：normal 比 maximum 快很多，体积差异对本项目不重要（大头是 Electron 本体）
compression: normal

win:
  # ⚠ 指向自产的 `.ico`（scripts/build-icon.mjs 生成），**不要**指回 icon.png。
  #   指 png 会让 electron-builder 去 spawn 它的 icon-tool.js 转换，本机实测
  #   那个子进程会 OOM（Zone Allocation failed）导致打包失败。
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # 客户装完直接能双击，不需要管理员权限也能装到用户目录
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false                # 给客户「选择安装位置」的机会
  perMachine: false              # 装到当前用户，避免 UAC
  allowToChangeInstallationDirectory: true
  # ⚠ 目录页选 `E:\` 时把安装目录变成 `E:\minipi`（不要让 exe / resources / locales
  #   直接铺到盘符根目录）。实现与"为什么不能无条件追加"见 build/installer.nsh。
  #   该文件**必须存成 UTF-8 with BOM**，否则 makensis 报 `Bad text encoding`。
  include: build/installer.nsh
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: minipi
  # ⚠ 不写 `deleteAppDataOnUninstall: true` —— 用户数据在 ~/.minipi，
  #   卸载时删掉会话/凭据是**数据丢失**，不是清理。留给用户自己决定。
  deleteAppDataOnUninstall: false

mac:
  # 同上：自产 `.icns`，避免 electron-builder 走 icon-tool 转换（会 OOM）
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  # 未签名发布：本地构建可跑，客户首次打开需右键→打开（QUICKSTART 里会写明）
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  title: minipi ${version}
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications

linux:
  icon: build/icon.png
  category: Utility
  target:
    - AppImage
